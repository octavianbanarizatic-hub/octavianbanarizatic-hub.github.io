<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Shared from Cadence</title>
  <meta name="description" content="Music shared from Cadence. Open it in the app, or listen on YouTube Music." />
  <meta property="og:title" content="Shared from Cadence" />
  <meta property="og:description" content="Tap to listen in Cadence, or on YouTube Music." />
  <meta property="og:image" content="https://octavianbanarizatic-hub.github.io/logo.png" />
  <meta name="theme-color" content="#0b0d14" />
  <link rel="icon" href="../icon.png" />
  <link rel="stylesheet" href="../page.css" />
</head>
<body>
  <main>
    <header class="brand">
      <svg width="28" height="28" viewBox="14 14 72 72" aria-hidden="true"><defs><mask id="mm" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100"><rect width="100" height="100" fill="#fff"/><circle cx="70.01" cy="51.7" r="9"/></mask><mask id="mp" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100"><rect width="100" height="100" fill="#fff"/><circle cx="50" cy="50" r="25"/></mask></defs><g mask="url(#mm)"><path d="M18.05 61.63A34 10 -20 0 1 46.58 40.6A34 10 -20 0 1 81.95 38.37" fill="none" stroke="#7a2229" stroke-width="5" stroke-linecap="round" mask="url(#mp)"/><path d="M30.5 50a19.5 19.5 0 1 0 39 0a19.5 19.5 0 1 0-39 0zM30.73 53H69.27A19.5 19.5 0 0 1 68.71 55.5H31.29A19.5 19.5 0 0 1 30.73 53zM32.7 59H67.3A19.5 19.5 0 0 1 65.37 62H34.63A19.5 19.5 0 0 1 32.7 59zM36.96 64.5H63.04A19.5 19.5 0 0 1 54.39 69H45.61A19.5 19.5 0 0 1 36.96 64.5z" fill="#e5343c" fill-rule="evenodd"/><path d="M81.95 38.37A34 10 -20 0 1 53.42 59.4A34 10 -20 0 1 18.05 61.63" fill="none" stroke="#7a2229" stroke-width="5" stroke-linecap="round"/></g><circle cx="70.01" cy="51.7" r="6" fill="#eef0f5"/></svg>
      <span>cadence</span>
    </header>

    <section class="card" id="card" hidden>
      <div class="art" id="art"></div>
      <div class="kicker" id="kicker"></div>
      <h1 id="title"></h1>
      <p class="by" id="by"></p>
      <div class="actions">
        <a class="btn primary" id="open" hidden>Open in Cadence</a>
        <a class="btn" id="yt" target="_blank" rel="noopener">Listen on YouTube Music</a>
      </div>
      <p class="get">No Cadence yet? <a href="https://github.com/octavianbanarizatic-hub/Cadence-app/releases/latest">Get it for Android</a></p>
    </section>

    <section class="card" id="broken" hidden>
      <h1>This link is broken</h1>
      <p class="by">Ask for it again, or copy all of it.</p>
    </section>
  </main>

  <script>
    // Cadence makes these links (src-tauri/src/share.rs); phones with the
    // app open them there and never show this page.
    const q = new URLSearchParams(location.search);
    const ID = /^[\w-]{11}$/;
    const releases = "https://github.com/octavianbanarizatic-hub/Cadence-app/releases/latest";
    const $ = (id) => document.getElementById(id);

    function show({ kicker, title, by, cover, yt }) {
      $("kicker").textContent = kicker;
      $("title").textContent = title;
      $("by").textContent = by;
      $("yt").href = yt;
      document.title = `${title} · Cadence`;
      if (cover) {
        const img = new Image();
        img.alt = "";
        // A YouTube thumbnail is 4:3 with the 16:9 picture in the middle; the
        // cover is the square at its centre.
        img.src = `https://i.ytimg.com/vi/${cover}/hqdefault.jpg`;
        $("art").append(img);
      }
      // Android: open the app straight away (even where links aren't set to open it).
      if (/Android/i.test(navigator.userAgent)) {
        const open = $("open");
        open.href = `intent://${location.host}${location.pathname}${location.search}#Intent;scheme=https;package=dev.cadence.player;S.browser_fallback_url=${encodeURIComponent(releases)};end`;
        open.hidden = false;
      }
      $("card").hidden = false;
    }

    const song = q.get("s"), album = q.get("al"), artist = q.get("ar"), list = q.get("yl"), ids = q.get("ids") ?? "";
    if (song && ID.test(song)) {
      show({ kicker: "Shared song", title: q.get("t") || "A song", by: q.get("a") ?? "", cover: song, yt: `https://music.youtube.com/watch?v=${song}` });
    } else if (album && /^MPRE[\w-]+$/.test(album)) {
      const cover = q.get("c");
      show({ kicker: "Shared album", title: q.get("t") || "An album", by: q.get("a") ?? "", cover: cover && ID.test(cover) ? cover : null, yt: `https://music.youtube.com/browse/${album}` });
    } else if (artist && /^UC[\w-]+$/.test(artist)) {
      show({ kicker: "Shared artist", title: q.get("t") || "An artist", by: "", cover: null, yt: `https://music.youtube.com/channel/${artist}` });
    } else if (list && /^[\w-]+$/.test(list)) {
      show({ kicker: "Shared playlist", title: "A playlist", by: "", cover: null, yt: `https://music.youtube.com/playlist?list=${list}` });
    } else if (ids && ids.length % 11 === 0 && /^[\w-]+$/.test(ids)) {
      const list = ids.match(/.{11}/g);
      const n = list.length;
      // YouTube makes a playlist of up to 50 songs from a list of ids.
      show({ kicker: "Shared playlist", title: q.get("p") || "A playlist", by: `${n} ${n === 1 ? "song" : "songs"}`, cover: list[0], yt: `https://www.youtube.com/watch_videos?video_ids=${list.slice(0, 50).join(",")}` });
    } else {
      $("broken").hidden = false;
    }
  </script>
</body>
</html>
